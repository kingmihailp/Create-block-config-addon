plugins {
    id 'net.neoforged.gradle.userdev' version '7.0.145'
    id 'java'
}

version = mod_version
group = mod_group_id
base.archivesName = mod_id

// Java 21 toolchain required for Minecraft 1.21.1
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// ─── Runs ────────────────────────────────────────────────────────────────────
runs {
    configureEach {
        systemProperty 'forge.logging.console.level', 'debug'
        modSource project.sourceSets.main
    }

    client { }

    server {
        programArgument '--nogui'
    }
}

// ─── Repositories ────────────────────────────────────────────────────────────
repositories {
    // Create mod and its dependencies
    maven {
        name = 'tterrag maven'
        url = 'https://maven.tterrag.com/'
    }
    // Flywheel snapshots / Registrate snapshots
    maven {
        name = 'devos.one snapshots'
        url = 'https://mvn.devos.one/snapshots/'
    }
    // Fallback: CurseMaven (uncomment if tterrag maven is unavailable)
    // maven { url = 'https://cursemaven.com' }
    mavenCentral()
}

// ─── Dependencies ────────────────────────────────────────────────────────────
dependencies {
    implementation "net.neoforged:neoforge:${neoforge_version}"

    // Create mod — compileOnly because it is a required runtime dependency
    // that players/server admins must install themselves.
    compileOnly("com.simibubi.create:create-${minecraft_version}:${create_version}:slim") {
        transitive = false
    }

    // Create's own required deps needed at compile time
    compileOnly("com.jozufozu.flywheel:flywheel-neoforge-${minecraft_version}:${flywheel_version}") {
        transitive = false
    }
    compileOnly("com.tterrag.registrate:Registrate:${registrate_version}") {
        transitive = false
    }
}

// ─── Jar manifest ────────────────────────────────────────────────────────────
jar {
    manifest {
        attributes([
            'Specification-Title'     : mod_id,
            'Specification-Vendor'    : mod_authors,
            'Specification-Version'   : '1',
            'Implementation-Title'    : project.name,
            'Implementation-Version'  : project.jar.archiveVersion,
            'Implementation-Vendor'   : mod_authors,
        ])
    }
}

// ─── Task configuration ──────────────────────────────────────────────────────
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

processResources {
    var replaceProperties = [
        minecraft_version: minecraft_version,
        neoforge_version : neoforge_version,
        mod_id           : mod_id,
        mod_name         : mod_name,
        mod_version      : mod_version,
        mod_authors      : mod_authors,
        mod_description  : mod_description,
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}
