modLoader = "javafml"
loaderVersion = "[4,)"
license = "MIT"

[[mods]]
    modId             = "${mod_id}"
    version           = "${mod_version}"
    displayName       = "${mod_name}"
    description       = "${mod_description}"

# ── NeoForge dependency ──────────────────────────────────────────────────────
[[dependencies.${mod_id}]]
    modId        = "neoforge"
    type         = "required"
    versionRange = "[${neoforge_version},)"
    ordering     = "NONE"
    side         = "BOTH"

# ── Minecraft dependency ─────────────────────────────────────────────────────
[[dependencies.${mod_id}]]
    modId        = "minecraft"
    type         = "required"
    versionRange = "[${minecraft_version},)"
    ordering     = "NONE"
    side         = "BOTH"

# ── Create dependency ────────────────────────────────────────────────────────
# This addon requires Create to be installed.
# Adjust versionRange to match the exact Create versions you support.
[[dependencies.${mod_id}]]
    modId        = "create"
    type         = "required"
    versionRange = "[0.5,)"
    ordering     = "AFTER"
    side         = "BOTH"
